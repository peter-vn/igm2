<style>
/* 01-base-and-hall.css: tokens, reset, header, battle frame basics, headquarters hall, dialog shell. Files load in the order of _order.txt; a later file wins over an earlier one. */
/* one phone column = 1 unit. 1rem is 14px on a 390px phone and follows the column width */
:root {
  --col: 100vw;
  --fs-xs: .857rem;
  --fs-sm: 1rem;
  --fs-md: 1.143rem;
  --fs-lg: 1.286rem;
  --fs-xl: 1.429rem;
  --fs-xxl: 1.857rem;
  --txt: #e6e8ee;
  --dim: #8d95a8;
  --gold: #f2c14e;
  --green: #5ec26a;
  --red: #e5585b;
  --blue: #5aa9f2;
  --purple: #a27be6;
  --orange: #f0925a;
  color-scheme: dark;
  --bg: #151515;
  --panel: #2e2e2e;
  --panel2: #3a3a3a;
  --line: #7d7d7d;
  --org: #e8922c;
  --fs-title: var(--fs-xl);
  --fs-sub: var(--fs-md);
}
@media (min-width: 640px) {
  :root { --col: 640px; }
}
@media (min-width: 1000px) {
  :root { --col: calc((min(100vw, 1600px) - 56px) / 3); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html {
  font-size: clamp(13px, calc(var(--col) * 0.0359), 15px);
  margin: 0;
  background: var(--bg);
  color: var(--txt);
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  scrollbar-gutter: stable;
}
body {
  margin: 0;
  color: var(--txt);
  font: 1rem/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #151515;
  overflow-x: hidden;
  min-height: 100dvh;
  font-variant-numeric: tabular-nums;
}
button {
  font: inherit;
  color: var(--txt);
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:hover:not(:disabled) { border-color: var(--blue); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #2c5fa3; border-color: #3f7ccc; }
button.danger { background: #6b2a2d; border-color: #9b3b3f; }
button.mini { padding: 3px 8px; }
select, input {
  font: inherit;
  color: var(--txt);
  background: #10131a;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 6px;
  max-width: 100%;
}
textarea {
  font: inherit;
  color: var(--txt);
  background: #10131a;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 6px;
  max-width: 100%;
  width: 100%;
  min-height: 90px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: var(--fs-xs);
}
h2 { margin: 0 0 8px; font-size: var(--fs-lg); }
h3 { margin: 0 0 8px; font-size: var(--fs-sm); color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
small, .dim { color: var(--dim); }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-xs); }
td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
th {
  border-bottom: 1px solid var(--line);
  padding: 4px 6px;
  text-align: left;
  vertical-align: top;
  color: var(--dim);
  font-weight: 600;
  position: sticky;
  top: 0;
  background: var(--panel);
  cursor: pointer;
  white-space: nowrap;
}
.top { align-items: center; gap: 12px; background: #2b2b2b; border-bottom: 0; top: 0; z-index: 7; }
.brand { font-weight: 700; flex: 1; }
.brand small { font-weight: 400; margin-left: 6px; }
.stat b { color: var(--gold); }
.speed button.on { background: #2c5fa3; border-color: #3f7ccc; }
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding-bottom: env(safe-area-inset-bottom);
  background: #2b2b2b;
  border-top: 0;
  transform: translateZ(0);
}
.tabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  border: 0;
  border-radius: 0;
  background: transparent;
  font-size: var(--fs-xs);
  color: #8a8a8a;
  padding: 8px 2px 6px;
}
.tabs button span { line-height: 1; font-size: 1.857rem; filter: none; }
.top .ic { font-size: var(--fs-md); padding: 3px 7px; }
main { margin: 0 auto; padding: 12px 12px 88px; max-width: 640px; }
.grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack > * + * { margin-top: 8px; }
.tag {
  display: inline-block;
  font-size: var(--fs-xs);
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--panel2);
  border: 1px solid var(--line);
  margin-right: 3px;
}
.tag.rare { color: var(--purple); border-color: var(--purple); }
.tag.neg { color: var(--red); border-color: var(--red); }
.tag.pos { color: var(--green); border-color: var(--green); }
.sp-img {
  width: 40px;
  height: 40px;
  image-rendering: pixelated;
  border-radius: 6px;
  background: var(--panel2);
  border: 1px solid var(--line);
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #fff;
  overflow: hidden;
}
.sp-img img { width: 100%; height: 100%; image-rendering: pixelated; }
.bar { height: 8px; background: #0d0f14; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--green); width: 0; }
.bar.hp > i { background: var(--green); }
.bar.hp.low > i { background: var(--red); }
.bar.mp > i { background: var(--blue); }
.bar.xp > i { background: var(--purple); }
.bar.act > i { background: var(--orange); transition: width 1s linear; transform-origin: 0 50%; will-change: transform; }
.unit { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: var(--fs-xs); padding: 3px 0; }
.unit .bars { grid-column: 1 / -1; display: grid; gap: 2px; }
.unit.dead { opacity: .4; }
.log { border-radius: 6px; overflow-y: auto; white-space: normal; height: 34dvh; max-height: none; contain: strict; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 10px; font-size: var(--fs-xs); }
.stats span b { color: var(--gold); font-weight: 600; }
.slot { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; margin-top: 4px; }
/* hidden state: fully transparent and not rendered, whatever the text height (long messages used to peek out at the bottom) */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: max-content;
  max-width: min(90vw, 420px);
  text-align: center;
  background: #000d;
  border: 1px solid var(--line);
  padding: 8px 14px;
  border-radius: 8px;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transform: translateX(-50%) translateY(16px);
  transition: transform .2s, opacity .2s, visibility 0s .2s;
}
.toast.show { opacity: 1; visibility: visible; transform: translateX(-50%); transition-delay: 0s; }
.toast.err { border-color: var(--red); }
.overlay { position: fixed; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; z-index: 30; }
.overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; width: min(380px, 90vw); }
.fatal { position: fixed; inset: 0; background: var(--bg); padding: 24px; z-index: 40; overflow: auto; }
.scroll { max-height: 62vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.q { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 3px 0; border-bottom: 1px dashed var(--line); }
@media (max-width: 560px) {
  .brand small { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
/* battlefield (landscape) */
.bf {
  position: relative;
  grid-template-columns: 1fr 1fr;
  align-items: end;
  overflow: hidden;
  background: linear-gradient(180deg, var(--s1), var(--s2));
  contain: layout paint;
  isolation: isolate;
  --s1: #2b4a3f;
  --s2: #1a2a26;
  --g: #233a30;
  aspect-ratio: 1 / 1;
  container-type: inline-size;
}
.bl { min-width: 0; justify-content: flex-end; left: 0; right: 0; bottom: 4%; height: 24%; align-content: flex-end; }
.br { min-width: 0; justify-content: flex-start; left: 0; right: 0; top: 44%; height: 24%; align-content: flex-end; }
.bu { position: relative; width: clamp(48px, 11vw, 96px); flex: none; transition: opacity .4s, filter .4s; z-index: 1; contain: layout style; }
.bu.big .spr { font-size: clamp(56px, 13vw, 110px); }
.bu .spr { line-height: 1; position: relative; user-select: none; isolation: isolate; }
.bu .spr::after {
  content: "";
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: -3px;
  height: 7px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.45), rgba(0,0,0,0) 70%);
  z-index: -1;
  pointer-events: none;
}
.bu .nm { font-size: 11px; opacity: .9; max-width: 100%; text-align: center; line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
.bu .sub {
  font-size: 10px;
  color: var(--dim);
  text-align: center;
  white-space: nowrap;
  transform: translate(-50%, -100%);
  gap: 3px;
  justify-content: center;
  flex-wrap: wrap;
  width: 160%;
  z-index: 4;
  pointer-events: none;
}
.bu .sub .tag { font-size: 9px; padding: 0 3px; }
.bu .bbars { display: grid; margin-bottom: 3px; order: 2; width: 100%; margin: 2px 0 0; gap: 2px; }
.bhp { background: rgba(0,0,0,.55); overflow: hidden; height: 1.1cqw; min-height: 3px; }
.bmp { background: rgba(0,0,0,.55); overflow: hidden; height: .9cqw; min-height: 3px; }
.bhp i { display: block; height: 100%; width: 100%; background: var(--red); transform-origin: 0 50%; transition: transform .25s; }
.bmp i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--blue);
  transform: scaleX(0);
  transform-origin: 0 50%;
  transition: transform .25s;
}
.bu.dead { opacity: .3; filter: grayscale(1); }
.bu .fx { position: absolute; left: 50%; width: 0; height: 0; z-index: 3; }
@media (max-width: 560px) {
  .bf { min-height: 190px; }
}
/* headquarters hall and dialog shell */
.hq { max-width: 520px; margin: 0 auto 12px; grid-template-columns: repeat(2, 1fr); display: flex; flex-direction: column; gap: 14px; }
.bld {
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
  display: grid;
  place-items: center;
  min-height: 84px;
  padding: 8px 12px;
  border-radius: 12px;
  background: #303030;
  border: 1px solid #8d8d8d;
}
.bld .ic { font-size: 3.143rem; line-height: 1; }
.bld small { color: var(--dim); }
.bld .badge {
  position: absolute;
  top: 6px;
  right: 8px;
  font-style: normal;
  font-size: var(--fs-xs);
  font-weight: 700;
  background: var(--red);
  color: #fff;
  border-radius: 99px;
  padding: 1px 7px;
}
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  background: #000a;
  z-index: 15;
  overscroll-behavior: contain;
  touch-action: none;
}
.upg { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.upg button { text-align: left; }
@media (min-width: 700px) {
  .modal { align-items: center; }
  .dlg { border-radius: 14px; }
}

/* 02-original-look.css: look and feel matched to the original, dialogs. Files load in the order of _order.txt; a later file wins over an earlier one. */
/* ===== look and feel matched to the original game ===== */
.top { display: block; padding: 10px 14px 10px; }
.top .r1 { display: flex; align-items: center; }
.burger { background: none; border: 0; font-size: 2.0rem; padding: 0 4px; line-height: 1; }
.top .brand { font-size: var(--fs-xl); font-weight: 700; flex: 1; }
.gembox { border: 1px solid #888; border-radius: 12px; padding: 5px 14px; font-size: var(--fs-lg); background: #3a3a3a; }
.gembox b { color: #eee; }
.r2 { display: flex; justify-content: flex-end; gap: 12px; font-size: var(--fs-md); font-weight: 700; margin-top: 8px; min-height: 24px; }
.cn { display: inline-flex; align-items: center; gap: 4px; }
.coin { display: inline-block; width: 20px; height: 20px; image-rendering: pixelated; vertical-align: middle; }
.coin.p { background: #e6e6e6; }
.coin.g { background: #f5d000; }
.coin.s { background: #9a9aa2; }
.coin.c { background: #c06a2b; }
.r3 { display: flex; gap: 10px; margin-top: 12px; }
.sq {
  width: 52px;
  height: 52px;
  font-size: 1.857rem;
  border-radius: 12px;
  background: #1d1d1d;
  border: 1px solid #888;
  color: var(--org);
  padding: 0;
  font-weight: 800;
}
.tabs button em { display: none; font-style: normal; font-size: var(--fs-xs); }
.tabs button.on { background: none; box-shadow: none; color: var(--org); }
.tabs button.on span { filter: none; }
.tabs button.on em { display: block; }
.bld b { font-size: var(--fs-xl); color: #e2e2e2; letter-spacing: .01em; }
.bld .sub { color: #d6d6d6; min-height: 22px; font-size: var(--fs-sub); }
.sign {
  position: absolute;
  left: 14px;
  top: -2px;
  width: 44px;
  height: 54px;
  border-radius: 4px 4px 22px 22px;
  background: linear-gradient(#8b5a30, #5a3a1d);
  border: 2px solid #3a2411;
  display: grid;
  place-items: center;
  font-size: var(--fs-xl);
}
.sign::before { content: ""; position: absolute; top: -9px; left: 8px; width: 3px; height: 10px; background: #aaa; box-shadow: 22px 0 #aaa; }
.dcard {
  position: relative;
  min-height: 110px;
  border-radius: 12px;
  border: 1px solid #8d8d8d;
  padding: 10px 12px;

}
.dcard .dn {
  color: #eee;

  overflow-wrap: anywhere;

  font-weight: 700;
  letter-spacing: .01em;
  line-height: 1.2;
}
.party { display: flex; gap: 6px; margin-top: 6px; }
.party .pm { display: block; width: 34px; }
.party .sp-img { width: 34px; height: 34px; border: 2px solid #8d8d8d; border-radius: 6px; }
.party .pm.asc .sp-img { border-color: #e0b43c; }
.dcard .st { margin-top: 6px; font-size: var(--fs-sub); }
.dcard .bar { width: 55%; height: 5px; margin-top: 5px; }
.chest {
  position: absolute;
  right: 10px;
  bottom: 8px;
  width: 62px;
  height: 56px;
  border-radius: 12px;
  background: #0007;
  border: 1px solid #aaa;
  font-size: 1.857rem;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.chest small { font-size: var(--fs-xs); color: #fff; font-weight: 700; }
.chest.full small { color: #ff5555; }
.tries {
  position: sticky;
  bottom: 70px;
  display: flex;
  justify-content: space-between;
  background: #3b3b3b;
  border-radius: 6px;
  padding: 10px 12px;
  font-weight: 700;
}
/* dialogs */
.modal { align-items: center; }
.dlg {
  background: #454545;
  border: 2px solid #0a0a0a;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  font-size: var(--fs-md);
  max-height: calc(100dvh - 8px);
  min-height: 0;
  overflow: hidden;
}
.dlg-body {
  padding: 18px 22px 6px;
  overflow: auto;
  overflow-y: auto;
  overscroll-behavior: contain;

  overflow-wrap: anywhere;
  scrollbar-width: none;
  scrollbar-gutter: auto;
}
.dt { margin: 0 0 12px; font-size: var(--fs-xxl); font-weight: 500; letter-spacing: .01em; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 22px; padding: 10px 22px 16px; }
.tx { background: none; border: 0; font-weight: 700; font-size: var(--fs-lg); color: #e3e3e3; padding: 6px; }
.tx:disabled { opacity: .4; }
.dlg p { margin: 0 0 8px; overflow-wrap: anywhere; }
.orange { color: var(--org); }
.ubtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  border-radius: 12px;
  border: 2px solid #8d8d8d;
  background: #4f4f4f;
  padding: 10px 6px;
  font-size: var(--fs-md);
}
.ubtn span { display: flex; gap: 8px; font-weight: 700; }
.nx { gap: 10px; flex-wrap: nowrap; }
.glist { border: 2px solid #999; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.grow {
  display: flex;
  align-items: stretch;
  border: 2px solid #8d8d8d;
  border-radius: 12px;
  overflow: hidden;
  background: #585858;

  min-height: 4.4rem;
}

.rec { width: 36%; border: 0; border-left: 2px solid #8d8d8d; border-radius: 0; background: #6e4f4f; font-weight: 700; font-size: var(--fs-lg); }
.hp { display: flex; gap: 14px; }

.hinfo { flex: 1; }
.slots { display: flex; gap: 10px; }
.skr { gap: 12px; flex-wrap: nowrap; }
.skb { flex: 1; border: 2px solid #999; border-radius: 12px; text-align: center; background: #4c4c4c; font-weight: 700; }
.skb small { display: block; color: #ddd; font-weight: 400; font-size: var(--fs-sm); }
.sgrid { display: grid; grid-template-columns: 1fr 1fr; align-content: start; min-height: 0; }

.pnav { display: flex; align-items: center; gap: 14px; justify-content: center; }
.pnav button {
  border-radius: 12px;
  height: 36px;
  width: auto;
  min-width: 72px;
  padding: 0 12px;
  white-space: nowrap;
  font-weight: 700;
  letter-spacing: .05em;
}
.desc { border: 2px solid #999; border-radius: 14px; min-height: 64px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border: 2px solid #777;
  border-radius: 12px;
  padding: 8px 2px;
  background: #4d4d4d;
  text-align: center;
  font-size: var(--fs-sm);
  cursor: pointer;
}
.tile.on { border-color: var(--org); background: #5a4a35; }
.tile input { position: absolute; opacity: 0; }
.tile .sp-img { width: 52px; height: 52px; }
.wide { width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; }
.log { background: transparent; padding: 0; font: var(--fs-md)/1.35 system-ui, sans-serif; margin-top: 8px; }
.ll { padding: 4px 6px; }
.ll:nth-child(even) { background: #4f4f4f; }
.ll .grn { color: #4cd05a; }

/* 03-item-pet-dialogs.css: real sprites, item / pet / quest / merchant dialogs, drawer menu, layout stability, settings. Files load in the order of _order.txt; a later file wins over an earlier one. */
/* ===== real sprites ===== */
.coin { border: 0; border-radius: 0; background: none; }
.bf { background-image: var(--bg, none), linear-gradient(180deg, var(--s1), var(--s2)); background-size: cover; background-position: center bottom; }
.dcard { background: linear-gradient(90deg, #303030 30%, #30303000 85%), var(--bn, none) right center / cover, hsl(var(--h) 30% 22%); }
.bu .spr img {
  width: clamp(40px, 9vw, 80px);
  height: auto;
  image-rendering: pixelated;
  display: block;
  max-height: calc(15.4cqw * var(--us, 1));
  object-fit: contain;
}
.bu.big .spr img { width: clamp(90px, 20vw, 160px); max-height: calc(30.8cqw * var(--us, 1)); }
.sq img { width: 70%; height: 70%; image-rendering: pixelated; object-fit: contain; }
.gembox img { image-rendering: pixelated; object-fit: contain; width: 20px; height: 20px; vertical-align: middle; }
.tabs button span img { width: 28px; height: 28px; image-rendering: pixelated; filter: grayscale(1) brightness(1.4); }
.sign img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.chest img { width: 34px; height: 34px; image-rendering: pixelated; display: block; margin: 0 auto; }
.slotb img, .tile img { image-rendering: pixelated; }
.hport img { image-rendering: pixelated; }
.itile img { image-rendering: pixelated; }
/* ===== item / pet / quest / merchant dialogs ===== */
.idet-top { display: flex; align-items: flex-start; }
.pdet .hport {
  position: relative;
  width: 100px;
  height: 100px;
  flex: none;
  border: 2px solid #8d8d8d;
  border-radius: 10px;
  background: #3b3b3b;
  padding: 6px;
  display: grid;
  place-items: center;
}
.idet .hport {
  position: relative;
  width: 100px;
  height: 100px;
  flex: none;
  border: 2px solid #8d8d8d;
  border-radius: 10px;
  background: #3b3b3b;
  padding: 6px;
  display: grid;
  place-items: center;
}
.hport .qty { position: absolute; right: 6px; bottom: 2px; font-style: normal; font-weight: 800; font-size: var(--fs-xl); text-shadow: 0 0 3px #000; }
.itype { margin-left: auto; font-weight: 700; letter-spacing: 1px; color: #bbb; font-size: var(--fs-xs); }
.idesc { margin: 10px 0; color: #cfc8bc; font-size: var(--fs-sm); line-height: 1.45; }
.pbar { display: flex; gap: 10px; margin: 10px 0; }
.pbox {
  flex: 1;

.idet h4 { margin: 12px 0 6px; font-size: var(--fs-lg); }
.rrow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.eq { font-weight: 800; padding: 0 4px; }
.itile.sm { width: 52px; height: 52px; display: inline-block; }
.itile.sm i { font-size: var(--fs-sm); }
.buy {
  width: 100%;

  padding: 12px;

.pdet .hport.big { width: 100px; height: 100px; }
.abox { border: 2px solid #8d8d8d; border-radius: 10px; padding: 8px 12px; margin: 8px 0; position: relative; }
.abox > b { display: block; margin-bottom: 2px; }
.dlg-foot .orange { color: var(--org); }
.drk-top { display: flex; justify-content: center; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 10px; }
.drk-top .hport { position: relative; width: 80px; height: 80px; border: 2px solid #8d8d8d; border-radius: 10px; background: #3b3b3b; padding: 6px; }
.grow.asc { background: #6b5a3a; border-color: #e6c35a; }
.grow .gp { position: relative; display: block; }
.grow .gp i { position: absolute; right: 2px; bottom: 0; font-style: normal; font-weight: 700; font-size: var(--fs-sm); text-shadow: 0 0 3px #000; }

/* ===== drawer menu, messages, bestiary ===== */
.dlg.drawerdlg {

}

.etile { aspect-ratio: 1; border: 2px solid #8d8d8d; border-radius: 12px; background: #4a4a4a; padding: 4px; contain: layout paint; }

.drawerdlg .dlg-foot { display: none; }
.dri:focus, .etile:focus, .msgb:focus { outline: none; }
/* ===== layout stability (no frame sliding) ===== */
body.mo { overflow: hidden; touch-action: none; }
.modal { padding: 4px; }

.dlg { width: min(560px, 100%); }
.dlg-body { flex: 1 1 auto; }

/* settings */
.srow { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 14px; margin: 10px 0; text-align: right; font-size: var(--fs-lg); }

.sbtn {

}
.sbtn.wide2 { width: auto; padding: 14px 18px; }
.srow:first-child .sbtn { font-weight: 500; font-size: var(--fs-xl); }
.recempty { text-align: center; margin: 18px 0 8px; font-size: var(--fs-lg); }

body.cb .red { color: #ffb020; }
@media (max-width: 340px) {
  .srow { grid-template-columns: 1fr 96px; }
}
.o-fall { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 4px 0 10px; font-size: var(--fs-md); }
.o-fall input { width: 1.4rem; height: 1.4rem; accent-color: var(--org); }

/* 04-heroes-battlefield.css: heroes list rows, battlefield square, hero list tweaks. Files load in the order of _order.txt; a later file wins over an earlier one. */
/* ===== heroes list (rows like the original) ===== */
.hlist { display: grid; gap: 10px; grid-template-columns: 1fr; }
.hrow {
  display: grid;
  align-items: stretch;
  width: 100%;
  padding: 0;
  color: #e8e8e8;
  background: #2b2b2b;
  border: 2px solid #8d8d8d;
  border-radius: 14px;
  overflow: hidden;
  text-align: left;
  contain: layout paint;
  height: 76px;
}
.hpt {
  position: relative;
  background: #3a3a3a;
  border-right: 2px solid #8d8d8d;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
.hpt .sp-img { width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; font-size: 2.0rem; }
.hpt i {
  position: absolute;
  right: 4px;
  bottom: 1px;
  font-style: normal;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px #000, 0 0 3px #000;
  font-size: var(--fs-xs);
}
.hpt i.mx { color: rgba(250, 160, 62, .75); }   /* level at the max of the tier: brass_border (#befaa03e) */
.hmid { display: flex; flex-direction: column; justify-content: center; min-width: 0; gap: 0; padding: 4px 10px; overflow: hidden; }
.hmid b { font-weight: 700; color: #f2f2f2; overflow-wrap: anywhere; line-height: 1.15; letter-spacing: .01em; display: block; }
.hmid em {
  min-height: 0;
  font-style: normal;
  color: #c8873a;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.2;
  font-size: var(--fs-sm);
}
.hmid em:empty { display: none; }
.hgear { display: flex; align-items: center; padding: 6px 8px 6px 0; gap: 5px; }
.gb {
  border: 2px solid #8d8d8d;
  background: #3a3a3a;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 9px;
}
.gb .sp-img { width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; image-rendering: pixelated; }
.gb img { width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; image-rendering: pixelated; }
@media (max-width: 380px) {
  .hrow { grid-template-columns: 56px 1fr auto; }
  .gb { width: 38px; height: 38px; }
}
/* ===== battlefield (square frame: foes upper-middle, team lower-middle, HP/MP bars only) ===== */
.bf {
  display: block;
  min-height: 0 !important;
  width: 100%;
  border: 2px solid #bdbdbd;
  border-radius: 14px;
  margin-top: 10px;
  background-color: #1e2b25;
}
/* --us: unit scale of one side, set by the battle code so a crowded team (raids) and the foes never overlap */
.bl {
  position: absolute;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  padding: 0 4cqw;
  gap: calc(2cqw * var(--us, 1)) calc(3cqw * var(--us, 1));
}
.br {
  position: absolute;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-end;
  padding: 0 4cqw;
  gap: calc(2cqw * var(--us, 1)) calc(3cqw * var(--us, 1));
}
.bu { width: calc(14.3cqw * var(--us, 1)); }
.bu.big { transition: opacity .4s, filter .4s; width: calc(30.8cqw * var(--us, 1)); }
.bu .spr { font-size: 0; min-height: 0; }
.bu .spr img { width: 100%; height: auto; image-rendering: pixelated; }
.bu .spr .ltr {
  width: 100%;
  height: auto;
  max-height: calc(15.4cqw * var(--us, 1));
  object-fit: contain;
  image-rendering: pixelated;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 1;
  font-size: 6cqw;
  background: #0006;
  border-radius: 50%;
}
.bhp { border-radius: 1px; }
.bmp { border-radius: 1px; }
.bu .sub { min-height: 0; }
.bu .nm { display: none; }
.bu { display: flex; flex-direction: column; align-items: center; }
.bu .fx { top: 20%; }
.dlg .bar.act { height: 3px; margin: 8px 6px 0; background: #555; border-radius: 2px; }
.dlg .bar.act > i { background: #d8d8d8; }
.hrow.busy { border-color: #8d8d8d; }
.gb { width: 42px; height: 42px; }
/* heroes list: no equipment icons, big class name + doctrine */
.hrow.asc { border-color: #e2c565; background: #2d281c; }
.hrow.asc .hpt { border-right-color: #e2c565; background: #3a3322; }
.hmid strong {
  font-size: var(--fs-sub);
  color: #ecd37c;
  font-weight: 700;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.2;
}
.bu.hero { cursor: pointer; }
/* the team: five heroes per row, the first hero bottom left, further rows above (as the original) */
.bl { flex-direction: column-reverse; flex-wrap: nowrap; align-items: center; justify-content: flex-start; row-gap: calc(2cqw * var(--us, 1)); }
.bl .brow { display: flex; align-items: flex-end; justify-content: center; gap: calc(3cqw * var(--us, 1)); }

/* 05-type-scale-team-loot.css: unified type scale, team composition, loot / report / quick sell / redeem. Files load in the order of _order.txt; a later file wins over an earlier one. */
/* ===== unified type scale: card title 20px, secondary line 16px, small badge 12px ===== */
.bld b { font-size: var(--fs-title); font-weight: 700; line-height: 1.2; }
.hmid b { font-size: var(--fs-title); font-weight: 700; line-height: 1.2; }
.hmid .hn {
  color: #d6d6d6;
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 1.2;
  font-size: var(--fs-sm);
}
.tries { font-size: var(--fs-sub); }
.chest small { font-size: var(--fs-xs); }
.hrow { grid-template-columns: 74px 1fr; }
.hrow .hgear { padding-right: 8px; }
.hrow:has(.hgear) { grid-template-columns: 66px 1fr auto; }
.hpt .dbw {
  position: absolute;
  border: 2px solid #8d8d8d;
  display: flex;
  align-items: center;
  justify-content: center;

  bottom: 2px;

  height: 24px;
  border-radius: 6px;
  border-color: #c9a24a;

.hpt .dbw img { width: 100%; height: 100%; image-rendering: pixelated; }
/* team composition */
.team { display: grid; gap: 8px; }
.team .hrow { background: #5a5a5a; height: 76px; align-items: stretch; }
.slotadd {

  height: 76px;

.slotadd .plus::after { content: ""; position: absolute; background: #bbb; top: 0; bottom: 0; left: 16px; width: 4px; }
.petslot { display: flex; justify-content: center; margin: 14px 0 12px; }
.slotadd.sq { width: 76px; }
.slotadd.sq .sp-img { width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; }
.tbtn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.tbtn .wide {
  height: 48px;
  font-weight: 700;
  font-size: var(--fs-lg);
  background: #5a5a5a;
  border: 2px solid #8d8d8d;
  border-radius: 12px;
  color: #e8e8e8;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0;
}
.dlg-foot .rgt { margin-left: auto; }
.itiles {
  flex-wrap: wrap;
  border: 2px solid #8d8d8d;
  border-radius: 12px;
  padding: 12px;
  min-height: 90px;
  display: grid;
  grid-template-columns: repeat(auto-fill, 68px);
  justify-content: space-between;
  gap: 10px 8px;
}
.itiles .itile { width: 76px; height: 76px; flex: none; }
.team .hrow .hn, .team .hrow strong { display: none; }
.team .hpt { min-height: 0; }
.team .hrow:focus-visible { outline: none; }
.team .hmid { justify-content: center; }
.team .hmid b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.team .hmid em { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.hrow:focus, .slotadd:focus { outline: none; }
.dri.spd { gap: 8px; flex-wrap: nowrap; }
.dri.spd .lbl { flex: 1; white-space: nowrap; }
.dri.spd button { color: #eee; }
.dri.spd button.on { border-color: var(--org, #e8922c); color: #e8922c; }
/* loot / report / quick sell / redeem */
.itiles.loot { border: 0; gap: 10px; min-height: 0; justify-content: flex-start; padding: 0; }
.itiles.slain { border: 0; gap: 10px; min-height: 0; justify-content: flex-start; padding: 0; }
.itiles.loot .itile { width: calc(25% - 8px); height: auto; aspect-ratio: 1; }
.itiles.slain .itile { width: calc(25% - 8px); height: auto; aspect-ratio: 1; }
.rdesc { font-style: italic; margin: 4px 0 14px; color: #e8e8e8; font-size: var(--fs-lg); }
.rrow b { font-weight: 600; }
.qs { display: grid; gap: 14px; justify-items: center; padding: 4px 0 8px; }
.qrow { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
.qbox {
  min-width: 56px;
  min-height: 52px;
  padding: 6px 18px;
  border: 2px solid #8d8d8d;
  border-radius: 12px;
  background: #555;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 1.714rem;

      ${ctx.game.speedLimit()>=30?`<div class="dri skp"><span class="lbl">Skip</span><input id="skiph" type="number" inputmode="decimal" min="0.02" max="168" step="any" value="${ui.skipH??1}" aria-label="Hours to skip"><span class="u">h</span><button data-act="skip">Go</button></div>`:""}</div>`}},messages(){let g=ctx.game,list=g.msgs.gotten.map(n=>`<button class="msgb" data-open="message" data-id="${n}">${esc(String(D.strings["lore_"+n+"_title"]??"").replace(/^"|"$/g,""))}</button>`).join("");return{title:S2("drawer_messages_received_title"),body:`<div class="msglist">${list}</div>`}},message(){let n=Number(ui.oid),t=String(D.strings["lore_"+n+"_title"]??"").replace(/^"|"$/g,""),b=String(D.strings["lore_"+n+"_body"]??"").replace(/^"|"$/g,"");return{title:t,foot:'<button class="tx lft" data-open="messages">BACK</button>',body:`<div class="lore">${b.split(/<br\/>\s*<br\/>/).map(para=>`<p>${esc(para).replace(/&lt;br\/&gt;/g,"<br>").replace(/&lt;i&gt;/g,"<i>").replace(/&lt;\/i&gt;/g,"</i>")}</p>`).join("")}</div>`}},faq(){let body=["idle_progression","death","dismiss_reorder","raids","epic_raids"].map(t=>`<div class="faq"><h3>${esc(String(D.strings["drawer_faq_"+t+"_title"]??{raids:"Raids"}[t]??t).replace(/^"|"$/g,""))}</h3><p>${esc(String(D.strings["drawer_faq_"+t+"_body"]).replace(/^"|"$/g,"")).replace(/\n/g,"<br>")}</p></div>`).join("");return{title:S2("drawer_faq_title"),body}},bestiary(){let g=ctx.game,raids=ui.bRaid,areas=(raids?RAID_ORDER2:g.dungeonOrder()).map(id=>g.areas[id]).filter(a=>a&&a.unlocked&&a.def.kind==="raid"==!!raids),tile=e=>g.seenEnemies.includes(e)?`<button class="etile" data-open="enemy" data-id="${e}">${sprite(D.enemies[e].image,D.enemies[e].name)}</button>`:`<span class="etile unk">${pic("unknown")||"?"}</span>`,body=areas.map(a=>`<div class="bar2">${esc(a.def.name)}</div><div class="egrid">${[...new Set(D.areas[a.id].enemyPool??[])].filter(e=>D.enemies[e]).map(tile).join("")}</div>`).join("");return{title:S2("drawer_bestiary_title"),body:`<div class="row bsw"><label><input type="radio" name="bs" data-act="bset" data-v="0" ${raids?"":"checked"}> Dungeons</label><label><input type="radio" name="bs" data-act="bset" data-v="1" ${raids?"checked":""}> Raids</label></div>${body||'<p class="dim">No area unlocked yet.</p>'}`}},enemy(){let g=ctx.game,e=D.enemies[ui.oid];if(!e)return ui.dlg="bestiary",{title:"",body:""};let loot=[...new Set((Array.isArray(e.drops)?e.drops:[]).map(d=>d.item))].filter(id=>D.items[id]).map(id=>ehb("loot:"+id,known(id)?sprite(D.items[id].image,D.items[id].name):pic("unknown")||"?","lt"+(known(id)?"":" unk"))).join(""),mana=typeof e.manaRegen=="number"?e.manaRegen:Math.floor(e.int/10)+10,st=[["HP",e.hp],["Mana gain",mana],["Constitution",e.con],["Defense",e.def],["Dexterity",e.dex],["Magic Defense",e.mdef],["Intelligence",e.int],["Experience",e.exp],["Attack dmg",`${e.minDamage} - ${e.maxDamage}`],["",`${e.ranged?"Ranged":"Melee"}, ${e.magic?"Magical":"Physical"}`]],top=`<div class="eloot"><b>Loot:</b><div>${loot||'<span class="dim">None</span>'}</div></div>`;return{title:e.name,foot:ui.back?.dlg==="area"?"":'<button class="tx lft" data-open="bestiary">BACK</button>',body:sheet(e.name,sprite(e.image,e.name),top,e.active,e.passive,st,D.strings[e.descKey]??e.desc??"")}},minion(){let g=ctx.game,id=Number(ui.oid),m=Object.values(g.areas).flatMap(a=>a.party??[]).find(u=>u.isMinion&&u.id===id);if(!m)return ui.dlg=ui.back?.dlg??null,ui.oid=ui.back?.oid??ui.oid,ui.back=null,{title:"",body:""};let d=m.def,[mn,mx]=attackRange(m),st=[["HP",`${m.hp}/${maxHp(m)}`],["Decay",`${decay(m)} per turn`],["Constitution",stat(m,"con")],["Defense",stat(m,"def")],["Dexterity",stat(m,"dex")],["Magic Defense",stat(m,"mdef")],["Intelligence",stat(m,"int")],["Threat",threat(m)],["Attack dmg",`${mn} - ${mx}`],["",`${isRanged(m)?"Ranged":"Melee"}, ${isMagic(m)?"Magical":"Physical"}`]],gear=[m.weapon,m.armor,m.accessory].filter(Boolean).map(it=>ehb("gear:"+it.id,sprite(it.image,it.name),"lt")).join(""),who=m.summoner?nameOf(m.summoner):"a Necromancer",top=`<div class="eloot msum"><div class="msl"><small>Summoned by</small><b>${esc(who)}</b></div><div class="msl"><small>Gear</small><div class="mgr">${gear||'<span class="dim">None</span>'}</div></div></div>`;return{title:d.name,body:sheet(d.name,sprite(d.image,d.name),top,d.active,d.passive,st,`It loses 25% of its max HP every turn and is three times as likely to be targeted.

${d.desc??""}`)}},recall(){let g=ctx.game,rows=g.dismissed.map((o,i)=>Date.now()-(o.t??0)>864e5?"":`<button class="grow" data-act="recallAdv" data-i="${i}"><span class="gp">${sprite(D.advs[o.cls]?.image,o.cls)}<i>${o.level}</i></span><span class="gnm"><b>${esc(o.nick??o.cls)}</b><small>${esc(D.advs[o.cls]?.name??o.cls)}</small><small class="orange">${esc([o.traitCommon,o.traitRare].filter(Boolean).map(traitName).join(", "))}</small></span></button>`).join("");return{title:S2("drawer_recall_adventurers_title"),body:`<p>${esc(String(S2("drawer_recall_adventurers_info")).replace(/^"|"$/g,""))}</p>${rows?`<div class="glist">${rows}</div>`:`<p class="recempty"><i>${esc(S2("drawer_recall_adventurers_empty_list"))}</i></p>`}`}},achievements(){let list=ctx.game.achievementList(),n=list.filter(x=>x.done).length;return{title:S2("drawer_achievements_title"),body:`<p class="dim">${n} of ${list.length} unlocked. The original keeps achievements on Google Play Games; names and descriptions here follow its unlock conditions.</p>
      <div class="achl">${list.map(x=>`<div class="ach ${x.done?"done":""}"><b>${esc(x.name)}</b><small>${esc(x.desc)}</small><span>${x.done?"Unlocked":"Locked"}</span></div>`).join("")}</div>`}},help(){let sec=(h,items)=>`<h3>${esc(h)}</h3><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;return{title:"Help",body:`<div class="help"><p class="dim">Web version ${esc(WEB_VERSION)}</p>
      ${[sec("What's new in 1.2.48",["Pets: the Healer and Fighter abilities show whole numbers (for example heals 1-1 HP) as in the original, not decimals.","Pet stats that depend on level (status turns, Bright, Regeneration, Barrier) now drop the fraction like the original instead of rounding up, so some levels give one point less than before."]),sec("What's new in 1.2.47",["Market and Workshop queue rows redesigned: item name on top, a full-width progress bar under it, then the price on the left and the timer on the right (SOLD rows: label and price on one line). No more empty space inside the frame."]),sec("What's new in 1.2.46",["Tavern: tap a guest to open its detail window (stats, skills, gear and traits, read only), as in the original. Recruit still uses the button on the right."]),sec("What's new in 1.2.45",["New redeem code speed30: unlocks the speed buttons x1, x5 and x30 in the menu (works the same as speed5, can be entered again)."]),sec("What's new in 1.2.44",["Market: the price of an item being sold now sits on one line under the timer, like the SOLD rows (it was stacked one coin per line).","The Storage and Recipes filter panels start collapsed and show only the current choice; the arrow bar opens them. Recipes gained the same collapse bar."]),sec("What's new in 1.2.43",["Adventurers: the level on a hero portrait turns brass when the hero is at the maximum level of its tier, as in the original.","Market and Workshop: a finished item keeps its slot until you collect it, so nothing new can be listed or crafted in a full queue; the Sell and Craft windows show the original warning.",'Tavern: when a new visitor arrives the Headquarters card shows "new!" and the guest is marked in the Tavern window; the mark clears when you leave the Tavern or recruit the guest.']),sec("What's new in 1.2.42",["Battle window of a Dungeon or Raid: tapping the Pet (top right) opens its information window, tapping the moon (top left) opens the Darkness window, as in the original. The moon phase now changes at the original thresholds (17, 34, 50, 67, 84)."]),sec("What's new in 1.2.41",["Tavern: the time the app was closed is counted exactly like live play (visitors and the countdown match to the second). Time away of 2 seconds or more is now caught up on start, focus and tab return (it was 60 s at start, so quick reopens lost up to a minute each)."]),sec("What's new in 1.2.40",["New redeem code raidfix: renews every raid attempt once per save. Test codes such as raidtries never needed a test mode and still work any number of times."]),sec("What's new in 1.2.39",["Save codes also keep the week of the last weekly reset, so a code from last week still renews the weekly quests and the gem Merchant after import.","The midnight reset is now covered by its own test: page left open, reopened days later, and save codes imported on another day."]),sec("What's new in 1.2.38",["Fixed: raid attempts (and the daily gems and Merchant refresh) did not renew after midnight when the save came from a save code. The code now always keeps the date of the last daily reset."]),sec("What's new in 1.2.37",["New redeem code speed5: unlocks the speed buttons x1 and x5 in the menu (x30 stays with the private code)."]),sec("What's new in 1.2.36",["Wipe & restart really erases everything now: the game used to save itself again while the page reloaded, so the old save came back. It now deletes the save, the redeemed codes and the settings (including saved teams) and starts from the first day.","Dismiss Adventurer: when the equipment does not fit in the Storage the hero is not dismissed and the message tells how many spaces to free (before, the gear could be lost). The team of an exploring hero is only recalled after this check.","Recall Adventurers: dismissed heroes are removed after 24 hours (before, only hidden). The original keeps them 26 hours; the web keeps 24 on request."]),sec("What's new in 1.2.35",["Battle window: the team is placed as in the original: five heroes per row, the first hero on the bottom row at the left, the next rows above it (a team of 8 shows 5 below and 3 above). Before, the order was mirrored and the rows depended on the screen width.","Raids: the Buy attempt button in the team window is removed (a raid with no try left still asks to buy one when you tap its card, as in the original). A cleared Epic Raid that still has loot to collect no longer sells a try or accepts a team; its team window asks you to collect the loot."]),sec("What's new in 1.2.34",["Save code, second step: the lists of items, enemies and drops you have seen are stored sorted as small gaps. A real 21-hero save went from 3451 to 2994 characters together with 1.2.33. Old codes still import."]),sec("What's new in 1.2.33",["Save code: a hero's random name is stored as one number, so codes are about 11% shorter (the full 19-hero roster: 1831 to about 1620 characters). Old codes still import."]),sec("What's new in 1.2.32",["Reloading the page (F5) no longer sends a team back to room 0: dungeons and raids resume in the room the team was in. This differs from the original, which restarts from room 0 whenever the game is reopened; wipes, promotions and new teams still restart from room 0 as before."]),sec("What's new in 1.2.31",["Style sheets tidied up: 59 rules for elements the game no longer has are removed and repeated rules are merged (842 rules down to 741). Nothing looks different."]),sec("What's new in 1.2.30",["Recipes: one style everywhere. In the item window, Builds from and Builds into now show ingredients joined by + and an arrow before the result, like the recipe list and the craft window (the = sign is gone)."]),sec("What's new in 1.2.29",['Epic Raids: a completed Epic Raid can no longer be entered or started again (as in the original, it is gone for good); collecting its last loot shows the "Epic Raid completed!" message.']),sec("What's new in 1.2.28",["Hero window: Lifesteal was shown 100 times too large (36% displayed as 3600%). It is now shown in percent as the engine uses it. Combat itself was not affected."]),sec("What's new in 1.2.26 - 1.2.27",["Adventurers list as in the original: the three equipment icons are back on the right, the Doctrine badge (with its points dot) sits on the bottom-left corner of the portrait, and Paragon is shown after the class name (for example Archer P2); long class names are cut with an ellipsis, the Paragon tag and the gear icons never move."]),sec("What's new in 1.2.25",["Evo vials: the trait window (Evo01 and Evo23 vials) was blank because of a missing helper after the code split. Fixed."]),sec("What's new in 1.2.23 - 1.2.24",["Tavern visitors: the rare trait is never a main trait any more (Bookworm+, Brute+, Feral+ were wrongly rolled as rare traits, giving heroes like Feral + Brute+). Rare traits are the original 14. Heroes and waiting visitors that already have such a rare trait lose it (their main trait stays)."]),sec("What's new in 1.2.22",["Feeding: the plain Egg can be used as pet food (it has a feed power), and the feed window has the original Feed all checkbox (on by default): one tap feeds the whole stack."]),sec("What's new in 1.2.21",["Pets that are exploring can be fed again (the feed list shows every pet, as in the original)."]),sec("What's new in 1.2.17 - 1.2.20",["Save code: Export now makes a much shorter code (roughly 20 times shorter than the first version, no prefix): only what differs from a new game is stored, heroes against a default hero, game ids as table indexes, then compressed. The Merchant stock is not in the code and is rolled again on import. The old long codes still import."]),sec("What's new in 1.2.16",["Feed pet window: the level number on the pet portrait is no longer cut off."]),sec("What's new in 1.2.15",["Pet window: one button as in the original - MERGE when the pet has a level or food and another pet exists, otherwise SET FREE. A pet that is exploring can be merged or set free too (its exploration is interrupted).","Merging returns you to the Shelter list."]),sec("What's new in 1.2.14",["Promotion: a promoted hero starts the new class at level 1 with 0 exp, as in the original (stats keep the previous class maximum).","Tavern: the next-visitor timer is never longer than the shortened interval (also after buying or using a Tavern speed upgrade).","Workshop: a recipe is shown once any ingredient (or the result) has been obtained or is in storage, as in the original."]),sec("What's new in 1.2.13 (key changes since 1.2.1)",["Header: the four coins sit on one row beside Merchant / Quests; header icons are centered in their squares.","Hero window: equipment icons sit inside their frames; Dismiss is removed (use Adventurers). The blinking arrow on the portrait opens Select promotion; for an ascended hero it asks to confirm the next Paragon rank.","Adventurers: the Order / Dismiss bar is docked on the bottom tabs, centered, and hidden until the arrow is pressed.","Promoting or ascending a hero who is in a dungeon restarts that dungeon with the same team (progress is kept once it reached the maximum); in a raid the raid ends. Potions and vials can be used while a hero is exploring (as in the original).","Egg: hatching opens the new pet's window over the egg window; a used-up Geode or Egg leaves its window open without count or actions. Item, recipe, potion, evolution and merge windows have only CLOSE.","Taps: CLOSE and RETREAT in the battle window are no longer redrawn every second, and in windows full of items only the changed tile is redrawn, so taps are not lost.","Other: HELP opens a popup window; info popups are as narrow as their text; the Workshop hammer is bright when you can craft; Merchant tiles are larger; internal cleanup of the stylesheet."]),sec("What's new in 1.2.1",["Tavern: buying Wait time -10% now also shortens the countdown to the next visitor by 10% (as in the original), so the upgrade is visible right away.","Building upgrades stop at the original maximum levels: Tavern capacity 7, Tavern speed 20, Market listings 10, Market speed 25, Workshop queue 10, Workshop speed 25, Quarters 23, Shelter 11. Before, the buttons kept going past them."]),sec("What's new in 1.2.0",["The look of 1.0.10 is back (colors, cards, windows, battle view) with the missing windows of the original game added in the same style.","New: Select promotion window (orange arrow next to the portrait), Merge pet and Feed pet windows, Merchant with REGULAR STOCK and SPECIAL RESERVE (tap to buy, long press to view), Quests grouped by college with each adventurer keeping its own LP and quest, gem confirm windows (raid try, refresh quests, reset doctrine), New tries bar on Raids, Clumsiness only lists adventurers who drank Agility potions.","Header: the coins now sit on the same row as the gems, so Merchant and Quests moved up and the game area is taller.","The game is split into a small page, one data file and one image pack (the original image files), so an update only downloads the small page."]),sec("What's new in 1.1.2",["New colors so the web-only Scarlet gear no longer looks like the Scarlet Veil: the heavy line (Azure Strand, Scarlet Bulwark) is steel blue and the light line (Verdant Strand, Scarlet Vestment) is jade green. The Veil family stays red.","Crimson Strand is now Azure Strand and Ember Strand is now Verdant Strand (same items, only the names changed, saves are not affected).","Two new Shroud versions, drawn with the same brass cogs as the Scarlet Shroud: Scarlet Citadel (heavy: Scarlet Bulwark + 5 Mysterious Cogs) and Scarlet Regalia (light: Scarlet Vestment + 5 Mysterious Cogs).","Effects: Citadel gives 30% counterattack on top of its HP, Constitution and defense; Regalia gives +32% healing and 25% status immunity on top of its HP, Intelligence and Dexterity."]),sec("What's new in 1.0.10",["Intercession, potion and Evo vial windows redesigned: left-aligned hero rows with level badge, value on the right, exploring or maxed heroes dimmed; the Evo trait picker shows the hero and its current trait above larger trait cards.","Bottom tabs: every inactive icon now has the same grey, the active one is orange (the Headquarters icon used to stay brighter).","CLOSE and BACK buttons are larger, ignore the iOS tap flash and focus ring, and still close when the finger slips a few pixels."]),sec("What's new in 1.0.9",["Dungeon and Raid cards show a live HP bar under each hero in the exploring party, as in the original."]),sec("What's new in 1.0.8",["Item windows follow the original: price box on the left, a square icon button on the right (open Geode, hatch Egg, feed Food, drink Potion). Food shows its Feed Power.",'Opening Geodes opens all of them at once and shows the "All Geodes opened" popup. A full Shelter shows the original egg message.',"Feeding: tap the apple on a food item and pick the pet. The old Feed list is gone from the pet window.","Pet window redesigned: Level, Food with a thin bar, ability boxes with two-decimal values, locked abilities with a lock icon, SET FREE button.","Hero potion page uses the real potion icons with a triangle page button. Report spacing and the Storage collapse bar match the original."]),sec("What's new in 1.0.7",["Progress bars now move on every screen frame (they were limited to 30 per second) and no longer stall when a game tick is late.","Menu: the Data and Save now entries are removed (the game saves by itself every 10 seconds and when you leave; Settings > Export save code still exports a save).","Fixed odd characters (the page now declares UTF-8), the missing title of the Raids FAQ entry; the real-money Shop button is removed.","Opens again without a connection once it has been opened online (offline shell), and can be added to the Home Screen for full screen.","Battle view: heroes and foes 10% larger, darkness moon top left (only in areas that have darkness; light gear makes it brighter, it does not hide it), accompanying pet top right.","Item windows follow the original layout (Con+3 Int+3 Dex+3, type label, owned count on the icon); dialogs are as wide as in the original.","Fixed: notices (redeem code, time away) could stay stuck at the bottom edge of the screen; they now sit above the tab bar and vanish completely. Added home-screen (full screen) support tags for iOS.","Interface sizes unified: one type scale (6 sizes) that follows the width of one phone screen. The desktop view shows three phone-sized columns with the same text and spacing.","First complete web release of the port: the original game data and rules, with the web changes listed below.","Paragon: two ranks after the ascension (see Progression).","Bestiary records every enemy the team defeats and the information of every item that drops.","Battle window: tap heroes, enemies and summoned minions for their sheets; crowded raid teams and foes always fit the frame.","Loot window: tap an item for its information and recipe."])].join("")}
      ${sec("Playing",["A hero at the top level of its tier loses no experience when it dies (as in the original).","There is no offline limit: the whole time away is simulated when you come back (it can take a few seconds per day away).","Raids: one free attempt per day; extra attempts cost gems (15 for Kaunis, Sleeping Planet and The Tower, 30 for the others).","Unique items (for example Serpent Sting) exist once per game; a lost one comes back in the gem stock for 1 gem.","Sprites: put PNGs named as in res/drawable into the img folder to show them; otherwise a letter is shown."])}
      ${sec("Progression (web changes)",["Stat growth: a new class starts from the previous class maximum, then +0.5 Con, Int and Dex per level.","Ascension needs x1.5 experience per level (original x2).","Paragon 1 and 2: an ascended level 45 hero of a final class ascends again (Intercession). Base stats x1.5 after the ascension, then x1.61 at Paragon 1 and x1.74 at Paragon 2; each rank also gives +25% doctrine bonuses, +9% damage dealt and -8% damage taken. Tap the Paragon label in the hero dialog for the totals.","Doctrine quests and LP belong to each adventurer.","Intercession ascends without resetting the level; on an ascended hero it gives the next Paragon rank, also without reset. The Paragon Writ was merged into it.","Evo Vials: Evo01 sets the main trait, Evo12 upgrades it to +, Evo23 changes the rare trait, Evo34 makes the rare trait + (10% stronger)."])}
      ${sec("Classes (web changes)",["Elementalist (from Adept): Elementalist, Elemental Adept and Elemental Magus cast Elemental Bolt (20% chance to Freeze, Stun or set Ablaze). At tier 6 the Magus becomes a Frost, Storm or Earth caster.","Frost: Frost Nova, then Blizzard; Shatter makes frozen enemies take more damage. Storm: Chain Lightning I and II; Static makes basic attacks jump to a second enemy. Earth: Tremor, then Earthquake (Petrify); Stoneskin shields itself and allies; more HP and armor.","Arcane Mastery: fire, summoning and elemental casters deal +25% damage at tier 8 and +50% at tier 9.","Fire line: Meteor III at tier 8, Meteor IV at tier 9. Summoners: Curse V hits 2 enemies; summoned minions are stronger; each summoner keeps its own minion (at most 2 in a dungeon, 3 in a raid).","Bard line: skills change every two tiers (Feint I, Feint II, Petrifying Melody I, Petrifying Melody II); Exalting shields and buffs 2 allies.","Bleed line: Thousand Cuts I (tiers 5-6), II (tiers 7-8), III (tier 9).","Eldritch Alchemist last cast x3 (original x10). Balrog unchanged."])}
      ${sec("Combat (web changes)",["Frozen or stunned flying enemies fall and can be hit in melee.","Crowd control (Stun, Freeze, Petrify, Silence, Terrify) received in the same turn runs at the same time, and all of it counts down by 1 each turn. If 3 of them land before the unit acts again, they all end after that turn.","Claws bleed also applies on melee counterattacks; effects from counterattacks show in the log."])}
      ${sec("Economy (web changes)",["30 gems a day. Geode: 1 to 100 gems (mean about 4, no daily limit).","Gem stock (weekly, fixed prices): Evo01 and Evo23 Vials 500, Evo12 and Evo34 Vials and Intercession 2,500, Mysterious Cog 1,000 once The Tower is open. Manual refresh: 500 gems. Vials and Intercession cannot be sold.","Encounter rate and experience per monster rise with the dungeon (The Desert, Golden City, Blackwater Port, Frostbite Peaks, Southern Grove, Barren Wastelands, Hidden City of Larox, Lost Lands). Aegis and Dreamcatcher are crafted, not bought."])}
      ${sec("New gear",["Scarlet Bulwark (heavy, 4 Azure Strands) and Scarlet Vestment (light, 4 Verdant Strands); Scarlet Veil (medium) needs 4 Scarlet Strands. Each Veil also needs a Veil Core (Lost Lands + Hidden City materials); Strands come from The Southern Grove and Barren Wastelands materials. Scarlet Citadel and Scarlet Regalia are their Shroud versions (+ 5 Mysterious Cogs).","Reach and thrown weapons that can hit flying enemies: Sha'huri Spear and Boomerang (The Desert), War Javelin (The Southern Grove), Infernal Glaive (Lost Lands)."])}
      ${sec("Daily affixes, events and elites",["Each day (local midnight) every dungeon has a 60% chance of one affix: Frenzy, Fortified, Swarm, Scavenger or Barren. It is shown before you send a team. Walls and early dungeons (Enchanted Forest, Desert, Golden City, Southern Grove, Lost Lands) use weaker values and never Frenzy.","About 5% of empty searches in Enchanted Forest, Golden City, Frostbite Peaks, Obsidian Mines, Barren Wastelands and Hidden City trigger an event: a wandering merchant, a locked chest, a cursed shrine or an ambush.","2% of encounters contain one elite monster with 1.5x HP and 1.5x EXP."])}
